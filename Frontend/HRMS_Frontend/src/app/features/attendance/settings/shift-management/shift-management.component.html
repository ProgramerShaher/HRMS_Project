<div class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col h-full gap-4 animate-in fade-in slide-in-from-bottom-5 duration-700" dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-800 gap-4 md:gap-0">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-md bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                <i class="pi pi-clock text-[11px]"></i>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight">إدارة المناوبات</h3>
                <p class="text-[9px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">إعداد أوقات العمل وفترات الدوام</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button pButton icon="pi pi-plus" title="إضافة مناوبة" label="إضافة"
                class="p-button-outlined p-button-primary !h-8 !px-3 !py-0 flex justify-center items-center !rounded-md hover:!bg-blue-50 dark:hover:!bg-blue-900/20 !border-blue-200 dark:!border-blue-800 transition-all text-[10px] font-bold"
                (click)="openNew()"></button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden flex flex-col mt-2">
        <p-table [value]="shifts()" [rowHover]="true" styleClass="p-datatable-sm clean-table" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr class="bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-100 dark:border-slate-800">
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none">اسم المناوبة</th>
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none">وقت البدء</th>
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none">وقت النهاية</th>
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none">عدد الساعات</th>
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none text-center">عبر يومين</th>
                    <th class="!px-3 !py-1.5 !text-[9px] !font-bold !text-slate-500 !bg-transparent !border-none text-center">الإجراءات</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-shift>
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-50 dark:border-slate-800/50">
                    <td class="!px-3 !py-1.5 !border-none font-bold text-[9px] text-slate-700 dark:text-slate-200">{{ shift.shiftNameAr }}</td>
                    <td class="!px-3 !py-1.5 !border-none text-[9px] font-mono font-bold text-blue-600 dark:text-blue-400">{{ shift.startTime }}</td>
                    <td class="!px-3 !py-1.5 !border-none text-[9px] font-mono font-bold text-indigo-600 dark:text-indigo-400">{{ shift.endTime }}</td>
                    <td class="!px-3 !py-1.5 !border-none text-[9px] font-mono">{{ shift.hoursCount }} س</td>
                    <td class="!px-3 !py-1.5 !border-none text-center">
                        <i class="pi text-[10px]" [ngClass]="{'pi-check-circle text-emerald-500': shift.isCrossDay, 'pi-minus text-slate-300 dark:text-slate-600': !shift.isCrossDay}"></i>
                    </td>
                    <td class="!px-3 !py-1.5 !border-none text-center">
                        <button pButton icon="pi pi-pencil" class="p-button-text p-button-warning !w-6 !h-6 !p-0 !text-[11px] mr-1" (click)="editShift(shift)"></button>
                        <button pButton icon="pi pi-trash" class="p-button-text p-button-danger !w-6 !h-6 !p-0 !text-[11px]" (click)="deleteShift(shift)"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog [(visible)]="shiftDialog" [style]="{width: '400px'}" header="تفاصيل المناوبة" [modal]="true" styleClass="p-fluid">
    <ng-template pTemplate="content">
        <form [formGroup]="shiftForm" class="pt-2">
            <div class="field mb-4">
                <label for="name" class="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1.5">اسم المناوبة</label>
                <input type="text" pInputText id="name" formControlName="shiftNameAr" required class="p-inputtext-sm w-full" />
                <small class="text-rose-500 text-[9px] mt-1 block" *ngIf="shiftForm.get('shiftNameAr')?.invalid && shiftForm.get('shiftNameAr')?.touched">الاسم مطلوب</small>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="field mb-4">
                    <label for="startTime" class="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1.5">وقت البدء (HH:mm)</label>
                    <input type="text" pInputText id="startTime" formControlName="startTime" placeholder="08:00" class="p-inputtext-sm w-full" />
                    <small class="text-rose-500 text-[9px] mt-1 block" *ngIf="shiftForm.get('startTime')?.invalid && shiftForm.get('startTime')?.touched">صيغة الوقت غير صحيحة</small>
                </div>
                <div class="field mb-4">
                    <label for="endTime" class="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1.5">وقت النهاية (HH:mm)</label>
                    <input type="text" pInputText id="endTime" formControlName="endTime" placeholder="16:00" class="p-inputtext-sm w-full" />
                    <small class="text-rose-500 text-[9px] mt-1 block" *ngIf="shiftForm.get('endTime')?.invalid && shiftForm.get('endTime')?.touched">صيغة الوقت غير صحيحة</small>
                </div>
            </div>

            <div class="field-checkbox flex items-center gap-2 mt-2 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg border border-slate-200 dark:border-slate-700">
                <p-checkbox formControlName="isCrossDay" [binary]="true" inputId="isCrossDay"></p-checkbox>
                <label for="isCrossDay" class="text-[10px] font-bold text-slate-700 dark:text-slate-300 cursor-pointer">هل المناوبة تعبر منتصف الليل؟</label>
            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="border-t border-slate-100 dark:border-slate-800 pt-3 flex justify-end gap-2">
            <button pButton label="إلغاء" class="p-button-text p-button-sm !text-[10px] !font-bold" (click)="hideDialog()"></button>
            <button pButton label="حفظ" icon="pi pi-check" class="p-button-primary p-button-sm !text-[10px] !font-bold" (click)="saveShift()"></button>
        </div>
    </ng-template>
</p-dialog>
