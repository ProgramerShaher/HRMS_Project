<div class="card p-0 overflow-hidden border-0 shadow-sm rounded-xl bg-white">
    <!-- Header -->
    <div class="p-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50 border-b border-slate-100">
        <div>
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                <i class="pi pi-users text-blue-600"></i>
                تقييم أداء فريقي
            </h2>
            <p class="text-slate-500 text-sm mt-1">المراجعة الإدارية والاعتماد لمرؤوسيك المباشرين</p>
        </div>
        <div class="flex gap-3">
            <span class="p-input-icon-left">
                <i class="pi pi-search text-slate-400"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="بحث في الموظفين..." class="p-inputtext-sm w-full md:w-64 border-slate-200 focus:border-blue-500" />
            </span>
        </div>
    </div>

    <!-- Table -->
    <p-table #dt [value]="appraisals()" [loading]="loading()" [rowHover]="true" styleClass="p-datatable-striped"
        responsiveLayout="scroll" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]"
        [globalFilterFields]="['employeeName', 'status', 'cycleName']"
        currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords} تقييم">

        <ng-template pTemplate="header">
            <tr class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider">
                <th class="font-semibold p-4">الموظف</th>
                <th class="font-semibold p-4">دورة التقييم</th>
                <th class="font-semibold p-4">الحالة</th>
                <th class="font-semibold p-4">الدرجة</th>
                <th class="font-semibold p-4 text-center">الإجراء</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-a>
            <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                <td class="p-4">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600">
                            {{ a.employeeName.substring(0, 1) }}
                        </div>
                        <span class="font-medium text-slate-800">{{ a.employeeName }}</span>
                    </div>
                </td>
                <td class="p-4 text-slate-600">{{ a.cycleName }}</td>
                <td class="p-4">
                    <p-tag *ngIf="a.status === 'SELF_EVALUATION'" value="بانتظار الموظف" severity="info" styleClass="px-2 text-[10px]"></p-tag>
                    <p-tag *ngIf="a.status === 'MANAGER_EVALUATION'" value="بانتظار مراجعتك" severity="warn" styleClass="px-2 text-[10px]"></p-tag>
                    <p-tag *ngIf="a.status === 'HR_REVIEW'" value="قيد اعتماد HR" severity="danger" styleClass="px-2 text-[10px]"></p-tag>
                    <p-tag *ngIf="a.status === 'COMPLETED'" value="مكتمل" severity="success" styleClass="px-2 text-[10px]"></p-tag>
                </td>
                <td class="p-4">
                    <span *ngIf="a.status === 'COMPLETED'" class="font-bold text-lg text-green-600">{{ a.finalScore }}%</span>
                    <span *ngIf="a.status !== 'COMPLETED'" class="text-slate-400 italic text-sm">- قيد المراجعة -</span>
                </td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-2">
                         <button *ngIf="a.status === 'MANAGER_EVALUATION'" pButton icon="pi pi-pencil" label="تقييم الآن"
                            class="p-button-sm p-button-primary shadow-sm"
                            (click)="openReview(a)"></button>
                            
                         <button *ngIf="a.status === 'COMPLETED'" pButton icon="pi pi-chart-bar" label="النتائج"
                            class="p-button-sm p-button-success p-button-outlined"
                            (click)="viewResult(a)"></button>

                         <button *ngIf="a.status !== 'MANAGER_EVALUATION' && a.status !== 'COMPLETED'" pButton icon="pi pi-eye" label="عرض"
                            class="p-button-sm p-button-secondary p-button-text"
                            (click)="openReview(a)"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-12">
                    <div class="flex flex-col items-center justify-center text-slate-300">
                        <i class="pi pi-users text-6xl mb-4 opacity-20"></i>
                        <p class="text-xl font-light">لا توجد طلبات تقييم لفريقك حالياً</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-toast position="bottom-left"></p-toast>
<p-confirmDialog [style]="{width: '400px'}" rejectButtonStyleClass="p-button-text p-button-secondary"></p-confirmDialog>
