<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 animate-in fade-in slide-in-from-bottom-5 duration-1000 h-full min-h-[300px]">

  <!-- Emergency Contacts Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.emergencyContacts || []" title="جهات الاتصال للطوارئ" itemLabel="جهة اتصال"
      icon="pi pi-phone" [columns]="contactColumns" (save)="onSaveContact($event)" (delete)="onDeleteContact($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <!-- Name -->
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الاسم الكامل لجهة الاتصال <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.contactNameAr" placeholder="الاسم الرباعي المعتمد"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- Phone -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">رقم الهاتف (+967) <span class="text-red-500">*</span></label>
            <div class="relative flex items-center" dir="ltr">
              <div class="absolute left-0 top-0 bottom-0 px-3 bg-slate-100 dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 rounded-l-md flex items-center justify-center">
                <span class="text-[10px] font-bold text-slate-600 dark:text-slate-400">+967</span>
              </div>
              <input pInputText [(ngModel)]="item.phonePrimary" maxlength="9" placeholder="7XXXXXXXX"
                class="w-full !h-8 !pl-12 !pr-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono tracking-widest focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
            </div>
          </div>

          <!-- Relationship -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">صلة القرابة</label>
            <input pInputText [(ngModel)]="item.relationship" placeholder="مثال: أب، زوج، أخ..."
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- Is Primary -->
          <div class="col-span-2 pt-1">
            <div class="flex items-center gap-2.5 p-2 rounded-md border border-indigo-100 dark:border-indigo-900/30 bg-indigo-50/50 dark:bg-indigo-900/10 transition-all hover:bg-indigo-50 dark:hover:bg-indigo-900/20">
              <p-checkbox [(ngModel)]="item.isPrimary" binary="true" inputId="isPrimaryContact" styleClass="!text-[10px]"></p-checkbox>
              <label for="isPrimaryContact" class="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 cursor-pointer select-none">اعتماد كجهة اتصال أساسية في حالات الطوارئ</label>
            </div>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>

  <!-- Dependents Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.dependents || []" title="سجل المرافقين" itemLabel="فرد من العائلة"
      icon="pi pi-heart-fill" [columns]="dependentColumns" (save)="onSaveDependent($event)"
      (delete)="onDeleteDependent($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <!-- Name -->
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الاسم الكامل للمرافق</label>
            <input pInputText [(ngModel)]="item.fullNameAr" placeholder="كما هو مسجل في البطاقة العائلية"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- National ID -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 font-sans">National ID</label>
            <input pInputText [(ngModel)]="item.nationalId" maxlength="11" placeholder="1XXXXXXXXX"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono tracking-widest focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- Birth Date -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">تاريخ الميلاد</label>
            <p-datePicker [(ngModel)]="item.birthDate" [showIcon]="true" appendTo="body" dateFormat="yy-mm-dd"
              styleClass="w-full" panelStyleClass="!text-[11px]"
              inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-datePicker>
          </div>

          <!-- Relationship -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">صلة القرابة</label>
            <input pInputText [(ngModel)]="item.relationship" placeholder="مثال: ابن، ابنة..."
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- Gender -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الجنس</label>
            <p-select [options]="genders" [(ngModel)]="item.gender" optionLabel="label" optionValue="value"
              appendTo="body" placeholder="اختر الجنس" panelStyleClass="!text-[11px]"
              styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>
</div>
