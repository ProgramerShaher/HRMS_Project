<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 animate-in fade-in slide-in-from-bottom-5 duration-1000 h-full min-h-[300px]">
  
  <!-- Qualifications Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.qualifications || []" title="المؤهلات العلمية" itemLabel="مؤهل"
      icon="pi pi-book" [columns]="qualColumns" (save)="onSaveQualification($event)"
      (delete)="onDeleteQualification($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الدرجة العلمية <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.degreeType" placeholder="بكالوريوس، ماجستير..."
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
          
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">التخصص الدراسي <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.majorAr" placeholder="نظم معلومات، محاسبة..."
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
          
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">المؤسسة التعليمية</label>
            <input pInputText [(ngModel)]="item.universityAr" placeholder="اسم الجامعة أو المعهد"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
          
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 font-sans">Graduation Year</label>
            <p-inputNumber [(ngModel)]="item.graduationYear" [useGrouping]="false" placeholder="YYYY"
              styleClass="w-full"
              inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] !font-bold focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-inputNumber>
          </div>

          <!-- File Upload for Qual -->
          <div class="col-span-2 pt-1">
            <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/50 rounded-md border border-dashed border-slate-300 dark:border-slate-700 hover:border-blue-400 transition-colors">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
                  <i class="pi pi-file text-[11px]"></i>
                </div>
                <div>
                  <p class="text-[10px] font-bold text-slate-700 dark:text-slate-200">صورة المؤهل</p>
                  <p class="text-[9px] text-slate-500">{{ item.file ? item.file.name : 'لم يتم اختيار ملف' }}</p>
                </div>
              </div>
              <p-fileUpload mode="basic" [auto]="true" chooseLabel="تصفح"
                styleClass="p-button-outlined p-button-sm !rounded-md !text-[10px] !font-bold !px-3 !h-8"
                (onSelect)="onQualFileSelect($event, item)"></p-fileUpload>
            </div>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>

  <!-- Experience Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.experiences || []" title="الخبرات العملية" itemLabel="خبرة"
      icon="pi pi-briefcase" [columns]="expColumns" (save)="onSaveExperience($event)"
      (delete)="onDeleteExperience($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">المسمى الوظيفي <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.jobTitleAr" placeholder="مثال: مدير تسويق"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
          
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">جهة العمل <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.companyNameAr" placeholder="اسم الشركة"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
          
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">من تاريخ</label>
            <p-datePicker [(ngModel)]="item.startDate" [showIcon]="true" appendTo="body" dateFormat="yy-mm-dd"
              styleClass="w-full" panelStyleClass="!text-[11px]"
              inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-datePicker>
          </div>
          
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">إلى تاريخ</label>
            <p-datePicker [(ngModel)]="item.endDate" [showIcon]="true" appendTo="body" dateFormat="yy-mm-dd"
              styleClass="w-full" panelStyleClass="!text-[11px]" [disabled]="item.isCurrent"
              inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-datePicker>
          </div>

          <!-- Current Job Toggle -->
          <div class="col-span-2 pt-1">
            <div class="flex items-center gap-2.5 p-2 rounded-md border border-blue-100 dark:border-blue-900/30 bg-blue-50/50 dark:bg-blue-900/10 transition-all hover:bg-blue-50 dark:hover:bg-blue-900/20">
              <p-checkbox [(ngModel)]="item.isCurrent" binary="true" inputId="isCurrentJob" styleClass="!text-[10px]"></p-checkbox>
              <label for="isCurrentJob" class="text-[10px] font-bold text-blue-700 dark:text-blue-400 cursor-pointer select-none">لا أزال أعمل هنا حالياً</label>
            </div>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>

  <!-- Professional Certifications (Full Width) -->
  <section class="lg:col-span-2">
    <app-dynamic-array-list [items]="data.certifications || []" title="الشهادات المهنية والدورات" itemLabel="شهادة"
      icon="pi pi-verified" [columns]="certColumns" (save)="onSaveCertification($event)"
      (delete)="onDeleteCertification($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-1">
          <!-- Left: Basic Info -->
          <div class="space-y-2.5">
            <div class="space-y-1">
              <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">اسم الشهادة / الدورة <span class="text-red-500">*</span></label>
              <input pInputText [(ngModel)]="item.certificationName" placeholder="PMP, CCNA..."
                class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-bold focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
            </div>

            <div class="space-y-1">
              <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">جهة الإصدار</label>
              <input pInputText [(ngModel)]="item.issuingOrganization" placeholder="PMI, Microsoft..."
                class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
            </div>

            <div class="space-y-1">
              <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">تاريخ الإصدار</label>
              <p-datePicker [(ngModel)]="item.issueDate" [showIcon]="true" appendTo="body" dateFormat="yy-mm-dd"
                styleClass="w-full" panelStyleClass="!text-[11px]"
                inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-datePicker>
            </div>
          </div>

          <!-- Right: Verification & Upload -->
          <div class="space-y-2.5">
            <div class="space-y-1">
              <label class="block text-[10px] font-bold text-slate-500 font-sans">Credential URL</label>
              <div class="relative flex items-center">
                <i class="pi pi-link absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]"></i>
                <input pInputText [(ngModel)]="item.credentialUrl" placeholder="https://..."
                  class="w-full !h-8 !pl-8 !pr-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-900/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono text-blue-600 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
              </div>
            </div>

            <div class="p-4 rounded-md border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/30 flex flex-col items-center justify-center text-center gap-2 hover:border-blue-400 transition-colors">
              <div class="w-10 h-10 rounded-full bg-red-50 dark:bg-red-900/20 text-red-500 flex items-center justify-center">
                <i class="pi pi-file-pdf text-[14px]"></i>
              </div>
              <div>
                <p class="text-[10px] font-bold text-slate-700 dark:text-slate-300">نسخة الشهادة</p>
                <p class="text-[9px] text-slate-500 mt-0.5">{{ item.file ? item.file.name : 'لم يتم الرفع بعد' }}</p>
              </div>
              <p-fileUpload mode="basic" [auto]="true" chooseLabel="رفع الملف"
                styleClass="p-button-sm p-button-outlined !rounded-md !text-[10px] !font-bold !h-8 !px-4"
                (onSelect)="onCertFileSelect($event, item)"></p-fileUpload>
            </div>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>
</div>
