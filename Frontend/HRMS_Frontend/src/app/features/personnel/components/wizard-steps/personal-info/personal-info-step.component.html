<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 animate-in fade-in slide-in-from-bottom-5 duration-1000">

  <!-- الصندوق الأول: الاسم والبيانات الشخصية -->
  <section class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col gap-3">
    <!-- الترويسة -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center">
          <i class="pi pi-id-card text-[11px]"></i>
        </div>
        <h3 class="text-xs font-bold text-slate-800 dark:text-white">الاسم الكامل والبيانات الشخصية</h3>
      </div>
      <span class="px-2.5 py-1 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-[10px] font-bold rounded border border-blue-100 dark:border-blue-800/50">أساسي</span>
    </div>

    <!-- الاسم بالعربية -->
    <div class="grid grid-cols-4 gap-2.5">
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الاسم الأول <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="data.firstNameAr" (ngModelChange)="onDataChange()" placeholder="أحمد"
          class="w-full !h-8 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] !px-2.5 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">اسم الأب <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="data.secondNameAr" (ngModelChange)="onDataChange()" placeholder="علي"
          class="w-full !h-8 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] !px-2.5 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">اسم الجد <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="data.thirdNameAr" (ngModelChange)="onDataChange()" placeholder="يحيى"
          class="w-full !h-8 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] !px-2.5 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">اللقب <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="data.lastNameAr" (ngModelChange)="onDataChange()" placeholder="صالح"
          class="w-full !h-8 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] !px-2.5 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
      </div>
    </div>

    <!-- الاسم بالانجليزية -->
    <div class="space-y-1 mt-1.5">
      <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Full English Name</label>
      <input pInputText [(ngModel)]="data.fullNameEn" (ngModelChange)="onDataChange()" (keypress)="validateEnglishName($event)"
        placeholder="AHMED ALI YAHYA SALEH"
        class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[10px] font-mono uppercase focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"
        dir="ltr" />
    </div>

    <!-- البيانات الشخصية -->
    <div class="grid grid-cols-2 gap-2.5 mt-1.5">
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">تاريخ الميلاد</label>
        <p-datePicker [(ngModel)]="data.birthDate" (ngModelChange)="onDataChange()" [showIcon]="true" appendTo="body" dateFormat="yy-mm-dd"
          styleClass="w-full"
          inputStyleClass="!h-8 !py-0 !leading-[30px] !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all"></p-datePicker>
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الجنسية</label>
        <p-select [options]="countries" [(ngModel)]="data.nationalityId" (ngModelChange)="onDataChange()"
          optionLabel="countryNameAr" optionValue="countryId" [filter]="true" appendTo="body" placeholder="اختر الجنسية"
          panelStyleClass="!text-[11px]"
          styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الجنس</label>
        <div class="flex gap-2 h-8">
          @for (gender of genders; track gender.value) {
          <button class="flex-1 flex items-center justify-center gap-1.5 rounded-md border transition-all text-[11px] font-bold"
            [ngClass]="data.gender === gender.value ? 'border-blue-500 bg-blue-50 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-500'"
            (click)="data.gender = gender.value; onDataChange()">
            <i [class]="gender.icon" class="text-[10px]"></i>
            {{ gender.label }}
          </button>
          }
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الحالة الاجتماعية</label>
        <p-select [options]="maritalStatuses" [(ngModel)]="data.maritalStatus" (ngModelChange)="onDataChange()"
          optionLabel="label" optionValue="value" appendTo="body" placeholder="اختر الحالة"
          panelStyleClass="!text-[11px]"
          styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
      </div>
    </div>
  </section>

  <!-- الصندوق الثاني: البقية (تواصل، هوية، صورة) -->
  <section class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col gap-3">
    <!-- الترويسة -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
          <i class="pi pi-address-book text-[11px]"></i>
        </div>
        <h3 class="text-xs font-bold text-slate-800 dark:text-white">الهوية ومعلومات التواصل</h3>
      </div>
    </div>

    <div class="flex gap-4">
      <!-- الصورة الشخصية -->
      <div class="relative flex-shrink-0 group/photo self-start">
        <div class="w-20 h-20 rounded-lg overflow-hidden border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex items-center justify-center relative">
          @if (profileImagePreview) {
            <img [src]="profileImagePreview" alt="Profile" class="w-full h-full object-cover" />
          } @else {
            <div class="flex flex-col items-center gap-1.5 text-slate-300 dark:text-slate-600">
              <i class="pi pi-user text-3xl opacity-50"></i>
            </div>
          }
          <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover/photo:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[1px]">
            <i class="pi pi-camera text-white text-xs"></i>
          </div>
        </div>
        <div class="absolute -bottom-2 -right-2">
          <p-fileUpload mode="basic" [auto]="true" accept="image/*" maxFileSize="5000000" chooseIcon="pi pi-pencil"
            styleClass="p-button-rounded p-button-sm !w-7 !h-7 !p-0 !text-[10px] !bg-emerald-600 !border-2 !border-white dark:!border-slate-900 !shadow-sm hover:!bg-emerald-700 transition-all"
            (onSelect)="onFileSelect($event)">
          </p-fileUpload>
        </div>
      </div>

      <!-- الحقول المتبقية -->
      <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5">
        
        <!-- رقم الهوية -->
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">رقم الهوية الوطنية</label>
          <input pInputText [(ngModel)]="data.nationalId" (ngModelChange)="onDataChange()" (keypress)="validateNumber($event)" maxlength="10" placeholder="0000000000"
            class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono tracking-wider focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
        </div>

        <!-- الرقم الوظيفي -->
        <div class="space-y-1">
          <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Employee No.</label>
          <input pInputText [(ngModel)]="data.employeeNumber" placeholder="P-0000"
            class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-100 dark:!bg-slate-950 !border-dashed !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono opacity-70 cursor-not-allowed" readonly />
        </div>

        <!-- الهاتف -->
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">رقم الهاتف (+967)</label>
          <input pInputText [(ngModel)]="data.mobile" (onBlur)="onDataChange()" maxlength="9" placeholder="777000000"
            class="w-full !h-8 !px-2.5 !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !rounded-md !text-[11px] font-mono tracking-widest focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" dir="ltr" />
        </div>

        <!-- الإيميل -->
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">البريد الإلكتروني</label>
          <input pInputText [(ngModel)]="data.email" (ngModelChange)="onDataChange()" placeholder="employee@company.com"
            class="w-full !h-8 !px-2.5 !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !rounded-md !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" dir="ltr" />
        </div>

      </div>
    </div>
  </section>

</div>
