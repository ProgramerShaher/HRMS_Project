<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 animate-in fade-in slide-in-from-bottom-5 duration-1000 h-full min-h-[300px]">

  <!-- Addresses Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.addresses || []" title="سجل العناوين السكنية" itemLabel="عنوان"
      icon="pi pi-directions" [columns]="addressColumns" (save)="onSaveAddress($event)"
      (delete)="onDeleteAddress($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <!-- Address Type (colspan 2) -->
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">نوع العنوان <span class="text-red-500">*</span></label>
            <p-select [options]="addressTypes" [(ngModel)]="item.addressType" appendTo="body" placeholder="المنزل، العمل..."
              panelStyleClass="!text-[11px]"
              styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
          </div>

          <!-- Country -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الدولة</label>
            <p-select [options]="countries" [(ngModel)]="item.countryId" (ngModelChange)="onCountryChange($event)"
              optionLabel="countryNameAr" optionValue="countryId" [filter]="true" appendTo="body" placeholder="اختر الدولة"
              panelStyleClass="!text-[11px]"
              styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
          </div>

          <!-- City -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">المدينة</label>
            <p-select [options]="cities()" [(ngModel)]="item.cityId" optionLabel="cityNameAr" optionValue="cityId"
              [filter]="true" appendTo="body" [disabled]="!item.countryId" placeholder="اختر المدينة"
              panelStyleClass="!text-[11px]"
              styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
          </div>

          <!-- Postal Code -->
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">الرمز البريدي</label>
            <input pInputText [(ngModel)]="item.zipCode" placeholder="12345"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono tracking-wider focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- Street -->
          <div class="col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">تفاصيل الشارع والمبنى</label>
            <input pInputText [(ngModel)]="item.street" placeholder="اسم الشارع، رقم المبنى، الحي..."
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>

  <!-- Bank Accounts Section -->
  <section class="h-full">
    <app-dynamic-array-list [items]="data.bankAccounts || []" title="بيانات الحسابات البنكية" itemLabel="حساب بنكي"
      icon="pi pi-credit-card" [columns]="bankAccountColumns" (save)="onSaveBankAccount($event)"
      (delete)="onDeleteBankAccount($event)">

      <ng-template #formTemplate let-item>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 mt-1">
          <!-- Bank -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">البنك المعتمد <span class="text-red-500">*</span></label>
            <p-select [options]="banks()" [(ngModel)]="item.bankId" optionLabel="bankNameAr" optionValue="bankId"
              [filter]="true" appendTo="body" placeholder="اختر البنك"
              panelStyleClass="!text-[11px]"
              styleClass="w-full !rounded-md !h-8 !text-[11px] shadow-none !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all [&_.p-select-label]:!py-0 [&_.p-select-label]:!px-2.5 [&_.p-select-label]:!leading-[30px]"></p-select>
          </div>

          <!-- Account Holder -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">اسم صاحب الحساب <span class="text-red-500">*</span></label>
            <input pInputText [(ngModel)]="item.accountHolderName" placeholder="الاسم كما في البنك"
              class="w-full !h-8 !px-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-bold focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
          </div>

          <!-- IBAN -->
          <div class="col-span-2 space-y-1 mt-1">
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400">IBAN (YE) <span class="text-red-500">*</span></label>
            <div class="relative flex items-center" dir="ltr">
              <div class="absolute left-0 top-0 bottom-0 px-3 bg-slate-100 dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 rounded-l-md flex items-center justify-center">
                <span class="text-[10px] font-bold text-slate-600 dark:text-slate-400">YE</span>
              </div>
              <input pInputText [(ngModel)]="item.ibanNumber" maxlength="22" placeholder="00-0000-0000-0000-0000-00"
                class="w-full !h-8 !pl-12 !pr-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono tracking-widest focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
            </div>
            <p class="text-[9px] text-slate-400 text-right mt-1">يتكون رقم الآيبان من 22 خانة</p>
          </div>

          <!-- Is Primary Toggle -->
          <div class="col-span-2 pt-1">
            <div class="flex items-center gap-2.5 p-2 rounded-md border border-blue-100 dark:border-blue-900/30 bg-blue-50/50 dark:bg-blue-900/10 transition-all hover:bg-blue-50 dark:hover:bg-blue-900/20">
              <p-checkbox [(ngModel)]="item.isPrimary" binary="true" inputId="isPrimary" styleClass="!text-[10px]"></p-checkbox>
              <div>
                <label for="isPrimary" class="block text-[10px] font-bold text-blue-700 dark:text-blue-400 cursor-pointer select-none">حساب أساسي للراتب</label>
                <p class="text-[9px] text-blue-600/70 dark:text-blue-400/70 mt-0.5">سيتم تحويل الرواتب الشهرية إلى هذا الحساب</p>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </app-dynamic-array-list>
  </section>
</div>
