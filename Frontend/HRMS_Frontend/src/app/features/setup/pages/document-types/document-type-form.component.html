<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800" dir="rtl">
    
    <!-- Dialog Header -->
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 rounded-t-xl">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-900/20 text-sky-600 dark:text-sky-400 flex items-center justify-center">
                <i [class]="isEditMode ? 'pi pi-pencil' : 'pi pi-plus'" class="text-[13px]"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{ isEditMode ? 'تعديل بيانات الوثيقة' : 'إضافة نوع وثيقة جديد' }}
            </h3>
        </div>
        <button type="button"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all"
            (click)="onCancel()">
            <i class="pi pi-times text-[12px]"></i>
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-4 p-5 overflow-y-auto">
        
        <!-- Name Ar -->
        <div class="col-span-1 space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الاسم بالعربية <span class="text-red-500">*</span></label>
            <input pInputText id="nameAr" formControlName="documentTypeNameAr" autofocus 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all" />
            <small class="text-red-500 text-[10px] block mt-0.5 font-bold" *ngIf="form.get('documentTypeNameAr')?.touched && form.get('documentTypeNameAr')?.invalid">حقل مطلوب</small>
        </div>

        <!-- Name En -->
        <div class="col-span-1 space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الاسم بالإنجليزية</label>
            <input pInputText id="nameEn" formControlName="documentTypeNameEn" 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all" />
        </div>

        <!-- Extensions -->
        <div class="col-span-1 space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الامتدادات المسموحة</label>
            <input pInputText id="ext" formControlName="allowedExtensions" placeholder="مثال: .pdf,.jpg" 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all" />
        </div>

        <!-- Max Size -->
        <div class="col-span-1 space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">أقصى حجم (ميجا)</label>
            <p-inputNumber id="size" formControlName="maxFileSizeMB" [min]="0" 
                styleClass="w-full" class="w-full"
                inputStyleClass="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all"></p-inputNumber>
        </div>

        <!-- Toggles -->
        <div class="col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="h-9 flex items-center gap-2 px-3 border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/30 rounded-md cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors"
                 (click)="form.get('isRequired')?.setValue(!form.get('isRequired')?.value)">
                <p-checkbox formControlName="isRequired" [binary]="true" inputId="req"></p-checkbox>
                <label for="req" class="cursor-pointer text-[11px] font-bold text-slate-700 dark:text-slate-300 flex-grow">وثيقة إجبارية</label>
            </div>
            <div class="h-9 flex items-center gap-2 px-3 border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/30 rounded-md cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors"
                 (click)="form.get('hasExpiry')?.setValue(!form.get('hasExpiry')?.value)">
                <p-checkbox formControlName="hasExpiry" [binary]="true" inputId="exp"></p-checkbox>
                <label for="exp" class="cursor-pointer text-[11px] font-bold text-slate-700 dark:text-slate-300 flex-grow">لها تاريخ انتهاء</label>
            </div>
        </div>

        <!-- Expiry Days (Conditional) -->
        <div class="col-span-1 space-y-1.5" *ngIf="form.get('hasExpiry')?.value">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">أيام التنبيه قبل الانتهاء</label>
            <p-inputNumber id="expDays" formControlName="defaultExpiryDays" [min]="0" 
                styleClass="w-full" class="w-full"
                inputStyleClass="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all"></p-inputNumber>
        </div>

        <!-- Description -->
        <div class="col-span-1 md:col-span-2 space-y-1.5 mt-2">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الوصف</label>
            <textarea pInputTextarea id="desc" formControlName="description" rows="3" 
                class="w-full !p-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-sky-500 transition-all resize-none"></textarea>
        </div>

    </div>

    <!-- Actions -->
    <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50 mt-auto rounded-b-xl">
        <button pButton label="إلغاء" type="button"
            class="p-button-text !h-9 !text-[12px] !text-slate-600 dark:!text-slate-400 !font-bold hover:!bg-slate-200 dark:hover:!bg-slate-800 !px-5 !rounded-lg transition-colors"
            (click)="onCancel()">
        </button>
        <button pButton [label]="isEditMode ? 'حفظ التغييرات' : 'إضافة نوع الوثيقة'" icon="pi pi-check" type="submit" [loading]="loading" [disabled]="form.invalid"
            class="p-button-primary !h-9 !bg-sky-600 hover:!bg-sky-700 !border-none !text-[12px] !px-6 !rounded-lg shadow-sm font-bold transition-colors">
        </button>
    </div>
</form>
