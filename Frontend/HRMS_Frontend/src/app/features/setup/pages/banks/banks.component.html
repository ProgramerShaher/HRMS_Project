<div class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col h-full gap-3 animate-in fade-in slide-in-from-bottom-5 duration-700" dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '320px'}" styleClass="clean-confirm"></p-confirmDialog>

    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-800 gap-4 md:gap-0">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-md bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                <i class="pi pi-building text-[11px]"></i>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight">البنوك المعتمدة</h3>
                <p class="text-[9px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">إدارة قائمة البنوك والمعاملات المالية</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 w-full md:w-auto">
            <div class="relative flex items-center flex-grow md:flex-none">
                <i class="pi pi-search absolute left-2.5 text-slate-400 text-[10px]"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="بحث..." 
                    class="w-full md:w-64 !h-8 !pl-8 !pr-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-blue-500 transition-all" />
            </div>
            <button pButton icon="pi pi-plus" label="إضافة جديد"
                class="p-button-outlined p-button-secondary !h-8 !text-[10px] !font-bold !rounded-md !px-3 hover:!bg-slate-50 dark:hover:!bg-slate-800 !border-slate-200 dark:!border-slate-700 !text-slate-700 dark:!text-slate-300 transition-all whitespace-nowrap"
                (click)="openNew()">
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="flex-grow bg-white dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800 overflow-hidden relative">
        <p-table #dt [value]="banks()" [rows]="10" [paginator]="true" [loading]="loading()"
                 styleClass="p-datatable-sm clean-table"
                 [globalFilterFields]="['bankNameAr', 'bankNameEn', 'swiftCode']"
                 [rowHover]="true"
                 responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800">
                    <th pSortableColumn="bankNameAr" class="!px-4 !py-2.5 !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">اسم البنك (عربي) <p-sortIcon field="bankNameAr"></p-sortIcon></th>
                    <th pSortableColumn="bankNameEn" class="!px-4 !py-2.5 !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">اسم البنك (إنجليزي) <p-sortIcon field="bankNameEn"></p-sortIcon></th>
                    <th pSortableColumn="swiftCode" class="!px-4 !py-2.5 !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">SWIFT Code <p-sortIcon field="swiftCode"></p-sortIcon></th>
                    <th pSortableColumn="isActive" class="!px-4 !py-2.5 !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">الحالة <p-sortIcon field="isActive"></p-sortIcon></th>
                    <th class="!px-4 !py-2.5 w-24 text-center !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">الإجراءات</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item>
                <tr class="hover:bg-blue-50/30 dark:hover:bg-blue-900/10 transition-colors duration-200 border-b border-slate-50 dark:border-slate-800/50">
                    <td class="!px-4 !py-3 !text-[10px] !text-slate-700 dark:!text-slate-300 !font-bold !border-none">{{item.bankNameAr}}</td>
                    <td class="!px-4 !py-3 !text-[10px] !text-slate-600 dark:!text-slate-400 !font-bold !border-none">{{item.bankNameEn}}</td>
                    <td class="!px-4 !py-3 !border-none"><code class="text-[9px] bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700 font-mono text-slate-600 dark:text-slate-400">{{item.swiftCode || '-'}}</code></td>
                    <td class="!px-4 !py-3 !border-none">
                        <span [class]="'px-2 py-0.5 rounded text-[9px] font-bold block w-fit ' + (item.isActive ? 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400' : 'bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400')">
                            {{item.isActive ? 'نشط' : 'متوقف'}}
                        </span>
                    </td>
                    <td class="!px-4 !py-3 !border-none">
                        <div class="flex items-center justify-center gap-2">
                            <button pButton icon="pi pi-pencil" 
                                class="p-button-text p-button-rounded !w-7 !h-7 !p-0 !text-[11px] !text-blue-500 hover:!bg-blue-100 dark:hover:!bg-blue-900/40 transition-colors" 
                                (click)="edit(item)"></button>
                            <button pButton icon="pi pi-trash" 
                                class="p-button-text p-button-rounded !w-7 !h-7 !p-0 !text-[11px] !text-red-500 hover:!bg-red-100 dark:hover:!bg-red-900/40 transition-colors" 
                                (click)="delete(item)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="text-center py-12">
                        <div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500">
                            <i class="pi pi-inbox text-3xl mb-3 opacity-50"></i>
                            <p class="text-[11px] font-bold text-slate-900 dark:text-white mb-1">لا توجد بيانات</p>
                            <p class="text-[9px]">لم يتم العثور على أي بنوك مسجلة.</p>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
