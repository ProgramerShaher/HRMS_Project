<div class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col h-full gap-3 animate-in fade-in slide-in-from-bottom-5 duration-700" dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '320px'}" styleClass="clean-confirm"></p-confirmDialog>

    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-800 gap-4 md:gap-0">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-md bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 flex items-center justify-center">
                <i class="pi pi-chart-bar text-[11px]"></i>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight">مكتبة مؤشرات الأداء (KPIs)</h3>
                <p class="text-[9px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">إعداد مؤشرات القياس القابلة لإعادة الاستخدام</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 w-full md:w-auto">
            <div class="relative flex items-center flex-grow md:flex-none">
                <i class="pi pi-search absolute left-2.5 text-slate-400 text-[10px]"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="بحث..." 
                    class="w-full md:w-64 !h-8 !pl-8 !pr-2.5 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[11px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-teal-500 transition-all" />
            </div>
            <button pButton icon="pi pi-plus" label="إضافة جديد"
                class="p-button-outlined p-button-secondary !h-8 !text-[10px] !font-bold !rounded-md !px-3 hover:!bg-slate-50 dark:hover:!bg-slate-800 !border-slate-200 dark:!border-slate-700 !text-slate-700 dark:!text-slate-300 transition-all whitespace-nowrap"
                (click)="openNew()">
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="flex-grow bg-white dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800 overflow-hidden relative">
        <p-table #dt [value]="kpis()" [rows]="10" [paginator]="true" [loading]="loading()"
                 styleClass="p-datatable-sm clean-table"
                 [globalFilterFields]="['kpiNameAr', 'category']"
                 [rowHover]="true"
                 responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800">
                    <th pSortableColumn="kpiNameAr" class="!px-4 !py-2.5 !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">اسم المؤشر <p-sortIcon field="kpiNameAr"></p-sortIcon></th>
                    <th pSortableColumn="category" class="!px-4 !py-2.5 text-center !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">الفئة <p-sortIcon field="category"></p-sortIcon></th>
                    <th pSortableColumn="measurementUnit" class="!px-4 !py-2.5 text-center !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">وحدة القياس <p-sortIcon field="measurementUnit"></p-sortIcon></th>
                    <th class="!px-4 !py-2.5 w-24 text-center !text-[9px] !font-bold !text-slate-500 dark:!text-slate-400 !uppercase tracking-wider !bg-transparent !border-none">الإجراءات</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item>
                <tr class="hover:bg-teal-50/30 dark:hover:bg-teal-900/10 transition-colors duration-200 border-b border-slate-50 dark:border-slate-800/50">
                    <td class="!px-4 !py-3 !text-[10px] !text-slate-700 dark:!text-slate-300 !font-bold !border-none">{{item.kpiNameAr}}</td>
                    <td class="!px-4 !py-3 !border-none text-center">
                        <span class="px-2 py-0.5 rounded text-[9px] font-bold block w-fit mx-auto bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">{{item.category}}</span>
                    </td>
                    <td class="!px-4 !py-3 !border-none text-center">
                        <span class="text-[10px] font-bold text-slate-600 dark:text-slate-400">{{item.measurementUnit}}</span>
                    </td>
                    <td class="!px-4 !py-3 !border-none">
                        <div class="flex items-center justify-center gap-2">
                            <button pButton icon="pi pi-pencil" 
                                class="p-button-text p-button-rounded !w-7 !h-7 !p-0 !text-[11px] !text-blue-500 hover:!bg-blue-100 dark:hover:!bg-blue-900/40 transition-colors" 
                                (click)="edit(item)"></button>
                            <button pButton icon="pi pi-trash" 
                                class="p-button-text p-button-rounded !w-7 !h-7 !p-0 !text-[11px] !text-red-500 hover:!bg-red-100 dark:hover:!bg-red-900/40 transition-colors" 
                                (click)="delete(item)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center py-12">
                        <div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500">
                            <i class="pi pi-inbox text-3xl mb-3 opacity-50"></i>
                            <p class="text-[11px] font-bold text-slate-900 dark:text-white mb-1">لا توجد بيانات</p>
                            <p class="text-[9px]">لم يتم العثور على أي مؤشرات أداء.</p>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- Inline Dialog Form (Styled to match DialogService output) -->
    <p-dialog [(visible)]="dialogVisible" [modal]="true" [dismissableMask]="true" [showHeader]="false"
              styleClass="clean-dialog !bg-transparent !border-none !shadow-none" [style]="{width: '500px'}" 
              contentStyleClass="!p-0 !overflow-visible">
        
        <div class="flex flex-col h-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800" dir="rtl">
            
            <!-- Dialog Header -->
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 rounded-t-xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 flex items-center justify-center">
                        <i [class]="currentItem.kpiId ? 'pi pi-pencil' : 'pi pi-plus'" class="text-[13px]"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                        {{ currentItem.kpiId ? 'تعديل المؤشر' : 'إضافة مؤشر جديد' }}
                    </h3>
                </div>
                <button type="button"
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all"
                    (click)="hideDialog()">
                    <i class="pi pi-times text-[12px]"></i>
                </button>
            </div>

            <!-- Form Content -->
            <div class="flex flex-col gap-y-4 p-5 overflow-y-auto">
                
                <div class="flex flex-col gap-1.5">
                    <label for="nameAr" class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">اسم المؤشر <span class="text-red-500">*</span></label>
                    <input type="text" pInputText id="nameAr" [(ngModel)]="currentItem.kpiNameAr" required autofocus
                        class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-teal-500 transition-all" />
                    <small class="text-red-500 text-[10px] block mt-0.5 font-bold" *ngIf="submitted && !currentItem.kpiNameAr">حقل مطلوب</small>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="category" class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الفئة</label>
                        <p-select id="category" [options]="categoryOptions" [(ngModel)]="currentItem.category" [editable]="true" placeholder="اختر أو اكتب" appendTo="body"
                            styleClass="w-full !h-9 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] flex items-center" class="w-full"></p-select>
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label for="unit" class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">وحدة القياس</label>
                        <input type="text" pInputText id="unit" [(ngModel)]="currentItem.measurementUnit" placeholder="مثال: نسبة، عدد..."
                            class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-teal-500 transition-all" />
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="desc" class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الوصف</label>
                    <textarea id="desc" pInputTextarea [(ngModel)]="currentItem.kpiDescription" rows="3"
                        class="w-full !p-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-teal-500 transition-all resize-none"></textarea>
                </div>

            </div>

            <!-- Actions -->
            <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50 mt-auto rounded-b-xl">
                <button pButton label="إلغاء" type="button"
                    class="p-button-text !h-9 !text-[12px] !text-slate-600 dark:!text-slate-400 !font-bold hover:!bg-slate-200 dark:hover:!bg-slate-800 !px-5 !rounded-lg transition-colors"
                    (click)="hideDialog()">
                </button>
                <button pButton [label]="currentItem.kpiId ? 'حفظ التغييرات' : 'إضافة المؤشر'" icon="pi pi-check" type="button" (click)="save()"
                    class="p-button-primary !h-9 !bg-teal-600 hover:!bg-teal-700 !border-none !text-[12px] !px-6 !rounded-lg shadow-sm font-bold transition-colors">
                </button>
            </div>
        </div>
    </p-dialog>
</div>
