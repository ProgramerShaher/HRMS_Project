<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800" dir="rtl">
    
    <!-- Dialog Header -->
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 rounded-t-xl">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                <i [class]="isEditMode ? 'pi pi-pencil' : 'pi pi-plus'" class="text-[13px]"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{ isEditMode ? 'تعديل سياسة الحضور' : 'إضافة سياسة حضور' }}
            </h3>
        </div>
        <button type="button"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all"
            (click)="onCancel()">
            <i class="pi pi-times text-[12px]"></i>
        </button>
    </div>

    <div class="flex flex-col gap-y-4 p-5 overflow-y-auto">
        
        <!-- Name -->
        <div class="flex flex-col gap-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">اسم السياسة <span class="text-red-500">*</span></label>
            <input pInputText id="name" formControlName="policyNameAr" autofocus 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-indigo-500 transition-all" />
            <small class="text-red-500 text-[10px] block mt-0.5 font-bold" *ngIf="form.get('policyNameAr')?.touched && form.get('policyNameAr')?.invalid">حقل مطلوب</small>
        </div>

        <!-- Assignments (Optional) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-4">
            <div class="flex flex-col gap-1.5">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">القسم المطبق عليه</label>
                <p-select [options]="departments()" formControlName="deptId" optionLabel="deptNameAr" optionValue="deptId" placeholder="اختر القسم (اختياري)" 
                    styleClass="w-full !h-9 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] flex items-center" 
                    class="w-full" [showClear]="true"></p-select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">المسمى الوظيفي المطبق عليه</label>
                <p-select [options]="filteredJobs()" formControlName="jobId" optionLabel="jobTitleAr" optionValue="jobId" placeholder="اختر الوظيفة (اختياري)" 
                    styleClass="w-full !h-9 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] flex items-center" 
                    class="w-full" [showClear]="true"></p-select>
            </div>
        </div>

        <!-- Settings -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50/50 dark:bg-slate-800/30 p-3.5 rounded-lg border border-slate-100 dark:border-slate-700/50 mt-1">
            <div class="flex flex-col gap-1.5">
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">سماحية التأخير</label>
                <p-inputNumber formControlName="lateGraceMins" [min]="0" suffix=" دقيقة" 
                    styleClass="w-full" class="w-full"
                    inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-white dark:!bg-slate-900 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono focus:!border-indigo-500 transition-all"></p-inputNumber>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">مضاعف الإضافي</label>
                <p-inputNumber formControlName="overtimeMultiplier" [min]="1" [step]="0.5" [minFractionDigits]="1" prefix="x " 
                    styleClass="w-full" class="w-full"
                    inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-white dark:!bg-slate-900 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono focus:!border-indigo-500 transition-all text-sky-600 dark:text-sky-400 font-bold"></p-inputNumber>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400">مضاعف العطلات</label>
                <p-inputNumber formControlName="weekendOtMultiplier" [min]="1" [step]="0.5" [minFractionDigits]="1" prefix="x " 
                    styleClass="w-full" class="w-full"
                    inputStyleClass="w-full !h-8 !px-2.5 !rounded-md !bg-white dark:!bg-slate-900 !border-slate-200 dark:!border-slate-700 !text-[11px] font-mono focus:!border-indigo-500 transition-all text-purple-600 dark:text-purple-400 font-bold"></p-inputNumber>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50 mt-auto rounded-b-xl">
        <button pButton label="إلغاء" type="button"
            class="p-button-text !h-9 !text-[12px] !text-slate-600 dark:!text-slate-400 !font-bold hover:!bg-slate-200 dark:hover:!bg-slate-800 !px-5 !rounded-lg transition-colors"
            (click)="onCancel()">
        </button>
        <button pButton [label]="isEditMode ? 'حفظ التغييرات' : 'إضافة السياسة'" icon="pi pi-check" type="submit" [loading]="loading()" [disabled]="form.invalid"
            class="p-button-primary !h-9 !bg-indigo-600 hover:!bg-indigo-700 !border-none !text-[12px] !px-6 !rounded-lg shadow-sm font-bold transition-colors">
        </button>
    </div>
</form>
