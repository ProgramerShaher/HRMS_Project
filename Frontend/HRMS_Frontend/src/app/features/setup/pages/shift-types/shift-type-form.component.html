<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800" dir="rtl">
    
    <!-- Dialog Header -->
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 rounded-t-xl">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-cyan-50 dark:bg-cyan-900/20 text-cyan-600 dark:text-cyan-400 flex items-center justify-center">
                <i [class]="isEditMode ? 'pi pi-pencil' : 'pi pi-plus'" class="text-[13px]"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{ isEditMode ? 'تعديل بيانات الوردية' : 'إضافة وردية جديدة' }}
            </h3>
        </div>
        <button type="button"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all"
            (click)="onCancel()">
            <i class="pi pi-times text-[12px]"></i>
        </button>
    </div>

    <div class="flex flex-col gap-y-4 p-5 overflow-y-auto">
        
        <!-- Name -->
        <div class="flex flex-col gap-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">اسم الوردية <span class="text-red-500">*</span></label>
            <input pInputText id="name" formControlName="shiftNameAr" autofocus 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-cyan-500 transition-all" />
            <small class="text-red-500 text-[10px] block mt-0.5 font-bold" *ngIf="form.get('shiftNameAr')?.touched && form.get('shiftNameAr')?.invalid">حقل مطلوب</small>
        </div>

        <!-- Times -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-4">
            <div class="flex flex-col gap-1.5">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">وقت البداية <span class="text-red-500">*</span></label>
                <div class="relative flex items-center">
                    <i class="pi pi-clock absolute right-3 text-emerald-500 dark:text-emerald-400 text-[10px] z-10"></i>
                    <p-inputMask id="start" mask="99:99" formControlName="startTime" placeholder="00:00" dir="ltr"
                        styleClass="w-full" class="w-full"
                        inputStyleClass="w-full !h-9 !pr-8 !pl-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-cyan-500 transition-all text-left"></p-inputMask>
                </div>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">وقت النهاية <span class="text-red-500">*</span></label>
                <div class="relative flex items-center">
                    <i class="pi pi-clock absolute right-3 text-rose-500 dark:text-rose-400 text-[10px] z-10"></i>
                    <p-inputMask id="end" mask="99:99" formControlName="endTime" placeholder="00:00" dir="ltr"
                        styleClass="w-full" class="w-full"
                        inputStyleClass="w-full !h-9 !pr-8 !pl-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-cyan-500 transition-all text-left"></p-inputMask>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="flex flex-col gap-3 mt-1">
            <div class="flex flex-col gap-1.5">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">عدد الساعات <span class="text-red-500">*</span></label>
                <p-inputNumber id="hours" formControlName="hoursCount" [min]="0" [max]="24" suffix=" ساعة" 
                    styleClass="w-full" class="w-full"
                    inputStyleClass="w-full !h-9 !px-3 !rounded-md !bg-slate-100 dark:!bg-slate-800 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono font-bold text-cyan-700 dark:text-cyan-400"></p-inputNumber>
            </div>

            <div class="flex items-center gap-2.5 bg-slate-50 dark:bg-slate-800/30 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors"
                 (click)="form.get('isCrossDay')?.setValue(!form.get('isCrossDay')?.value)">
                <p-checkbox formControlName="isCrossDay" [binary]="true" inputId="cross"></p-checkbox>
                <div class="flex flex-col flex-grow select-none">
                    <label for="cross" class="text-[11px] font-bold text-slate-700 dark:text-slate-300 cursor-pointer mb-0.5">وردية مسائية (تعبر اليوم)</label>
                    <span class="text-[9px] text-slate-500 dark:text-slate-500 font-medium">مفيدة عند حساب التأخير والحضور لليوم التالي</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50 mt-auto rounded-b-xl">
        <button pButton label="إلغاء" type="button"
            class="p-button-text !h-9 !text-[12px] !text-slate-600 dark:!text-slate-400 !font-bold hover:!bg-slate-200 dark:hover:!bg-slate-800 !px-5 !rounded-lg transition-colors"
            (click)="onCancel()">
        </button>
        <button pButton [label]="isEditMode ? 'حفظ التغييرات' : 'إضافة الوردية'" icon="pi pi-check" type="submit" [loading]="loading" [disabled]="form.invalid"
            class="p-button-primary !h-9 !bg-cyan-600 hover:!bg-cyan-700 !border-none !text-[12px] !px-6 !rounded-lg shadow-sm font-bold transition-colors">
        </button>
    </div>
</form>
