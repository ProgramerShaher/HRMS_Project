<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800" dir="rtl">
    
    <!-- Dialog Header -->
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 rounded-t-xl">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                <i [class]="isEditMode ? 'pi pi-pencil' : 'pi pi-plus'" class="text-[13px]"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{ isEditMode ? 'تعديل نوع الإجازة' : 'إضافة نوع إجازة جديد' }}
            </h3>
        </div>
        <button type="button"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all"
            (click)="onCancel()">
            <i class="pi pi-times text-[12px]"></i>
        </button>
    </div>

    <div class="flex flex-col gap-y-4 p-5 overflow-y-auto">
        
        <!-- Name -->
        <div class="flex flex-col gap-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">اسم الإجازة بالعربية <span class="text-red-500">*</span></label>
            <input pInputText id="nameAr" formControlName="leaveTypeNameAr" autofocus 
                class="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] focus:!bg-white dark:focus:!bg-slate-900 focus:!border-amber-500 transition-all" />
            <small class="text-red-500 text-[10px] block mt-0.5 font-bold" *ngIf="form.get('leaveTypeNameAr')?.touched && form.get('leaveTypeNameAr')?.invalid">حقل مطلوب</small>
        </div>

        <!-- Default Days -->
        <div class="flex flex-col gap-1.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">الرصيد الافتراضي (أيام) <span class="text-red-500">*</span></label>
            <p-inputNumber id="days" formControlName="defaultDays" [min]="0" 
                styleClass="w-full" class="w-full"
                inputStyleClass="w-full !h-9 !px-3 !rounded-md !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 !text-[12px] font-mono focus:!bg-white dark:focus:!bg-slate-900 focus:!border-amber-500 transition-all"></p-inputNumber>
        </div>

        <!-- Toggles -->
        <div class="grid grid-cols-1 gap-3 mt-2">
            <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-800/30 p-3 rounded-lg border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors"
                 (click)="form.get('isDeductible')?.setValue(!form.get('isDeductible')?.value)">
                <p-checkbox formControlName="isDeductible" [binary]="true" inputId="deduct"></p-checkbox>
                <div class="flex flex-col cursor-pointer select-none">
                    <label class="text-[11px] font-bold text-slate-700 dark:text-slate-300 cursor-pointer">يخصم من الرصيد السنوي</label>
                    <span class="text-[9px] text-slate-500 dark:text-slate-500 mt-0.5">عند تفعيل هذا الخيار سيتم خصم أيام الإجازة من رصيد الموظف</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-800/30 p-3 rounded-lg border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors"
                 (click)="form.get('requiresAttachment')?.setValue(!form.get('requiresAttachment')?.value)">
                <p-checkbox formControlName="requiresAttachment" [binary]="true" inputId="attach"></p-checkbox>
                <div class="flex flex-col cursor-pointer select-none">
                    <label class="text-[11px] font-bold text-slate-700 dark:text-slate-300 cursor-pointer">يتطلب مرفق</label>
                    <span class="text-[9px] text-slate-500 dark:text-slate-500 mt-0.5">إجبار الموظف على إرفاق مستند عند طلب هذه الإجازة</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50 mt-auto rounded-b-xl">
        <button pButton label="إلغاء" type="button"
            class="p-button-text !h-9 !text-[12px] !text-slate-600 dark:!text-slate-400 !font-bold hover:!bg-slate-200 dark:hover:!bg-slate-800 !px-5 !rounded-lg transition-colors"
            (click)="onCancel()">
        </button>
        <button pButton [label]="isEditMode ? 'حفظ التغييرات' : 'إضافة نوع الإجازة'" icon="pi pi-check" type="submit" [loading]="loading" [disabled]="form.invalid"
            class="p-button-primary !h-9 !bg-amber-600 hover:!bg-amber-700 !border-none !text-[12px] !px-6 !rounded-lg shadow-sm font-bold transition-colors">
        </button>
    </div>
</form>
