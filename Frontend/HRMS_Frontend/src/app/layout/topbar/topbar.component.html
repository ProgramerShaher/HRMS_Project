<header class="h-[72px] z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 sticky top-0">
    <!-- Right side (Start in RTL) -->
    <div class="flex flex-col justify-center">
        <h2 class="text-[17px] font-extrabold text-slate-800 dark:text-white leading-tight">مستشفى الشفاء التخصصي</h2>
        <span class="text-[11px] font-semibold text-slate-400">HR Command Center · v2.4</span>
    </div>

    <!-- Center (Search) -->
    <div class="flex-1 max-w-lg mx-8 relative">
        <div class="relative flex items-center w-full h-[42px] rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 overflow-hidden focus-within:ring-2 focus-within:ring-blue-100">
            <i class="pi pi-search text-slate-400 absolute right-4"></i>
            <input type="text" placeholder="بحث عن موظف أو قسم..." 
                class="w-full h-full bg-transparent border-none pr-10 pl-4 text-sm focus:outline-none dark:text-white placeholder-slate-400 font-medium" />
        </div>
    </div>

    <!-- Left side (End in RTL) -->
    <div class="flex items-center gap-5">
        <!-- Icons -->
        <div class="flex items-center gap-3">
            <button class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center relative hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
                <i class="pi pi-envelope text-lg"></i>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full shadow-sm">3</span>
            </button>
            <button class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center relative hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
                <i class="pi pi-bell text-lg"></i>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full shadow-sm">5</span>
            </button>
        </div>
        
        <!-- Profile -->
        <div class="flex items-center gap-3 pl-2 border-r border-slate-200 dark:border-slate-700 pr-5" (click)="toggleMenu($event)" style="cursor: pointer;">
            @if (user(); as currentUser) {
            <div class="text-right">
                <p class="text-[13px] font-bold text-slate-800 dark:text-white">{{ currentUser.fullName || currentUser.userName }}</p>
                <p class="text-[11px] font-medium text-slate-500">{{ currentUser.roles?.[0] || 'مستخدم' }}</p>
            </div>
            <p-avatar label="{{ (currentUser.fullName?.[0] || currentUser.userName?.[0] || 'U') | uppercase }}" shape="circle" styleClass="w-10 h-10 bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300 border-2 border-white dark:border-zinc-700 shadow-sm text-lg"></p-avatar>
            }
        </div>
        <p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" styleClass="w-48"></p-menu>
    </div>
</header>
