<aside
    class="h-full bg-white dark:bg-slate-900 text-slate-900 dark:text-white flex flex-col border-l border-slate-200 dark:border-slate-800 relative overflow-hidden transition-[width] duration-300"
    [ngClass]="{
           'w-64': !layoutService.isSidebarCollapsed(),
           'w-20': layoutService.isSidebarCollapsed()
       }">

    <!-- 1. Branding Section -->
    <div class="h-[72px] flex items-center px-6 gap-3 border-b border-slate-200 dark:border-slate-800 shrink-0 bg-white dark:bg-slate-900 transition-all duration-300"
        [class.justify-start]="!layoutService.isSidebarCollapsed()"
        [class.justify-center]="layoutService.isSidebarCollapsed()"
        [class.px-0]="layoutService.isSidebarCollapsed()">

        <div class="w-10 h-10 rounded-xl bg-teal-600 flex items-center justify-center text-white font-bold text-xl shadow-sm shrink-0">
            ش
        </div>
        
        <div class="flex flex-col whitespace-nowrap transition-opacity duration-300"
            [class.opacity-100]="!layoutService.isSidebarCollapsed()"
            [class.opacity-0]="layoutService.isSidebarCollapsed()"
            [class.hidden]="layoutService.isSidebarCollapsed()">
            <h1 class="text-[15px] font-extrabold text-slate-800 dark:text-white leading-tight">الشفاء التخصصي</h1>
            <span class="text-[11px] font-medium text-slate-500">إدارة الموارد البشرية</span>
        </div>
    </div>

    <!-- 2. Navigation Menu -->
    <nav class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-1.5 custom-scroll bg-slate-50/50 dark:bg-slate-900">
        <ng-container *ngFor="let item of menuItems">
            <!-- Parent Item -->
            <div class="flex flex-col mb-1" [hasPermission]="item.permission">
                    <a [routerLink]="item.children ? null : item.route" (click)="toggleSubmenu(item, $event)"
                    [routerLinkActive]="item.children ? '' : 'bg-blue-100/50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 font-bold'"
                    [routerLinkActiveOptions]="{exact: false}"
                    class="group flex items-center px-2 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-slate-800 transition-all duration-200 cursor-pointer"
                    [class.justify-between]="!layoutService.isSidebarCollapsed()"
                    [class.justify-center]="layoutService.isSidebarCollapsed()">
                    
                    <div class="flex items-center gap-3">
                        <i [class]="item.icon" class="text-[1.1rem] transition-colors group-[.router-link-active]:text-blue-600"></i>
                        <span class="text-[12px] tracking-wide whitespace-nowrap font-semibold transition-opacity duration-300"
                            [class.opacity-100]="!layoutService.isSidebarCollapsed()"
                            [class.opacity-0]="layoutService.isSidebarCollapsed()"
                            [class.hidden]="layoutService.isSidebarCollapsed()">{{ item.label }}</span>
                    </div>

                </a>

                <!-- Children Container (Expanded) -->
                <div *ngIf="item.children && item.expanded && !layoutService.isSidebarCollapsed()" class="flex flex-col mt-1 pr-6 gap-0.5">
                    <ng-container *ngFor="let child of item.children">
                        <a [hasPermission]="child.permission" [routerLink]="child.route"
                            routerLinkActive="bg-slate-900 hover:bg-slate-900 !text-white font-bold dark:bg-white dark:hover:bg-white dark:!text-slate-900 shadow-sm hover:!text-white"
                            class="relative px-3 py-1.5 rounded-md text-[11px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center gap-2">
                            <span>{{ child.label }}</span>
                        </a>
                    </ng-container>
                </div>
            </div>
        </ng-container>
    </nav>

    <!-- 3. Footer / Collapse -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
        <button (click)="layoutService.toggleSidebar()"
            class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-sm font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
            <i class="pi" [ngClass]="layoutService.isSidebarCollapsed() ? 'pi-chevron-left' : 'pi-chevron-right'"></i>
            <span *ngIf="!layoutService.isSidebarCollapsed()">طي القائمة</span>
        </button>
    </div>
</aside>
